name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: pokemon-resale/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: pokemon-resale/apps/web

      - name: Lint
        run: npm run lint
        working-directory: pokemon-resale/apps/web

      - name: Test
        run: npm test -- --run
        working-directory: pokemon-resale/apps/web

      - name: Build
        run: npm run build
        working-directory: pokemon-resale/apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          npm run start &
          npx wait-on http://localhost:3000
          lhci autorun --config=.lighthouserc.js || echo "Lighthouse CI failed with thresholds, but continuing..."
        working-directory: pokemon-resale/apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: pokemon-resale/apps/web/.lighthouseci/
          retention-days: 30
